        <div class="mpc-about row">
            <div class="col-2">
                <span class="label-text">REC-303</span>
            </div>
            <div class="col-6">
                <p class="about-text">All sounds designed by Rob Coven</p>
            </div>
        </div>
        <div class="row mpc-row">
            <div class="col-12 mpc-container">
                    <div class="mpc-left">
                        <div class="mpc-display">
                            <span class="label-text" id="fileName">Click a Pad</span>
                            <span class="label-text" id="value">00</span>
                        </div>
                        <div class="mpc-leftcontent">
                            <img class="mpc-speaker" src="./speaker.svg" alt="">
                            <img class= "mpc-logo" src="./rec.svg" alt="">
                            <div class="mpc-slider">
                                <span class="mpc-fader-text">000</span>
                                <div class="mpc-divider">
                                    <input type="range" id="volumeSlider" min="0" max="100" value="50" class="mpc-fader">
                                </div>

                                <span class="mpc-fader-text">100</span>

                            </div>
                        </div>
                    </div>
                    <div class="mpc-right">
                        <div class="pad m-pad" value="01"></div>
                        <div class="pad m-pad" value="02"></div>
                        <div class="pad m-pad" value="03"></div>
                        <div class="pad m-pad" value="04"></div>
                        <div class="pad m-pad" value="05"></div>
                        <div class="pad m-pad" value="06"></div>
                        <div class="pad m-pad" value="07"></div>
                        <div class="pad m-pad" value="08"></div>
                        <div class="pad m-pad" value="09"></div>
                        <div class="pad p-desktop" value="10"></div>
                        <div class="pad p-desktop" value="11"></div>
                        <div class="pad p-desktop" value="12"></div>
                    </div>
            </div>
